<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba barcode 4x4 BCH</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #info {
    position: fixed; top: 8px; left: 8px; right: 8px; z-index: 10;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(0, 0, 0, .65); color: #0f8;
    font: 16px/1.3 system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="info">Cargando cámara…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
<script>
  // IDs de los marcadores que descargaste de la galería (editá esta lista)
  const IDS = [008, 026];

  const info = document.getElementById('info');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.domElement.style.position = 'absolute';
  renderer.domElement.style.top = '0';
  renderer.domElement.style.left = '0';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.Camera();
  scene.add(camera);

  const source = new THREEx.ArToolkitSource({ sourceType: 'webcam' });

  const context = new THREEx.ArToolkitContext({
    detectionMode: 'mono_and_matrix',
    matrixCodeType: '4x4_BCH_13_9_3',
  });

  function onResize() {
    source.onResizeElement();
    source.copyElementSizeTo(renderer.domElement);
    if (context.arController !== null) {
      source.copyElementSizeTo(context.arController.canvas);
    }
  }

  source.init(() => setTimeout(onResize, 300));
  window.addEventListener('resize', onResize);

  context.init(() => {
    camera.projectionMatrix.copy(context.getProjectionMatrix());
    info.textContent = 'Apuntá a un marcador…';
  });

  // Un cubo de color distinto por marcador
  const roots = {};
  IDS.forEach((id, i) => {
    const root = new THREE.Group();
    root.visible = false;
    scene.add(root);

    new THREEx.ArMarkerControls(context, root, {
      type: 'barcode',
      barcodeValue: id,
    });

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(i / IDS.length, 0.8, 0.55) })
    );
    cube.position.y = 0.5;
    root.add(cube);
    roots[id] = root;
  });

  function loop() {
    requestAnimationFrame(loop);
    if (source.ready) context.update(source.domElement);
    const visibles = IDS.filter(id => roots[id].visible);
    if (visibles.length) info.textContent = 'Detectados: ' + visibles.join(', ');
    renderer.render(scene, camera);
  }
  loop();
</script>
</body>
</html>
