<style>body{margin:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif}

#ui{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:999px;background:rgba(10,14,26,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:30;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;max-width:90vw;opacity:.45;transition:opacity .25s}

#ui button{width:30px;height:30px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font:600 18px/1 system-ui;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#ui button:active{background:rgba(255,255,255,.45)}
#ui input{width:min(24vw,96px);min-width:56px;height:20px;margin:0}
#pc{min-width:38px;text-align:center;font:600 11px system-ui;cursor:pointer}
/* ---------- Pantalla de entrada: átomo de nube de probabilidad hecho de 0 y 1 (estilo Matrix) ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#05070d;transition:opacity .7s ease,transform .7s cubic-bezier(.6,0,.2,1)}
#intro.out{opacity:0;transform:scale(1.35);pointer-events:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#intro p{position:absolute;left:0;right:0;bottom:calc(11% + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:#2dff7a;font:400 16px/1 "Courier New",monospace;letter-spacing:1.5px;text-shadow:0 0 8px rgba(45,255,122,.8);animation:resp 1.2s ease-in-out infinite alternate}

#capp[hidden]{display:none}
#capp .ch{font-size:12px;letter-spacing:.5px;color:#9fb0d0;margin:0 2px 8px}
#capp .cg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#capp .chip{display:flex;align-items:center;gap:7px;padding:9px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:#cfd8ee;font:13px system-ui,sans-serif;text-align:left;touch-action:manipulation;opacity:.5}
#capp .chip i{flex:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--c);background:transparent}
#capp .chip.on{opacity:1;border-color:var(--c);color:#fff;background:rgba(255,255,255,.07)}

#capp .cf{display:flex;gap:6px;margin-top:8px}
#capp .cf button{flex:1;padding:8px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font:13px system-ui,sans-serif;touch-action:manipulation}
#capp .ca{display:flex;align-items:center;gap:8px;margin:10px 2px 0;font-size:13px;color:#cfd8ee}

#capp{max-height:calc(100vh - 70px - env(safe-area-inset-top,0px));overflow-y:auto}
#capp .cn{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
#capp .cn button{padding:9px 0;border-radius:10px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:#cfd8ee;font:600 13px system-ui,sans-serif;opacity:.5;touch-action:manipulation}
#capp .cn button.on{opacity:1;border-color:#3de6ff;background:rgba(61,230,255,.16);color:#fff;box-shadow:0 0 8px rgba(61,230,255,.35)}
#capp .sec{margin-top:12px}
#capp .tgl{display:block;width:100%;padding:6px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.22);background:rgba(8,12,24,.6);color:#fff;font:12.5px system-ui,sans-serif;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#capp .tgl.on{border-color:#3de6ff;background:rgba(61,230,255,.16);color:#fff;box-shadow:0 0 8px rgba(61,230,255,.35)}

<div id="intro" aria-hidden="true"><canvas id="mx"></canvas><p id="introT">Preparando la cámara…</p></div>
<script>
(function(){const cv=document.getElementById("mx");if(!cv)return;const cx=cv.getContext("2d",{alpha:false}),rm=matchMedia("(prefers-reduced-motion:reduce)").matches,R=Math.random;
let W=0,H=0,S=0;
function rs(){const d=Math.min(devicePixelRatio||1,1.5);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);S=Math.min(W,H)*.34}
rs();addEventListener("resize",rs);
const g=()=>R()<.5?0:1,P=[];
/* sprites precalculados: dibujar una imagen es mucho más barato que texto con resplandor en cada cuadro */
const mk=(w,fn)=>{const c=document.createElement("canvas");c.width=c.height=w;fn(c.getContext("2d"),w);return c};
const gl=(col,glow)=>[0,1].map(d=>mk(48,(x,w)=>{x.font="bold 26px 'Courier New',monospace";x.textAlign="center";x.textBaseline="middle";x.fillStyle=col;if(glow){x.shadowColor=col;x.shadowBlur=glow}x.fillText(""+d,w/2,w/2+1)}));
const GH=gl("#e6ffee",8),GT=gl("#00ff6a",0),GE=gl("#3de6ff",9);
const rg=(w,st)=>mk(w,(x,w)=>{const q=x.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);st.forEach(s=>q.addColorStop(s[0],s[1]));x.fillStyle=q;x.fillRect(0,0,w,w)});
const DG=rg(32,[[0,"rgba(25,255,122,1)"],[.5,"rgba(25,255,122,.95)"],[1,"rgba(25,255,122,0)"]]),
 DN=rg(64,[[0,"rgba(255,255,255,1)"],[.22,"rgba(234,255,240,1)"],[.3,"rgba(120,255,170,.55)"],[1,"rgba(45,255,122,0)"]]),
 DE=rg(64,[[0,"rgba(255,255,255,1)"],[.2,"rgba(61,230,255,1)"],[.3,"rgba(61,230,255,.5)"],[1,"rgba(61,230,255,0)"]]);
const spr=(im,x,y,s,al)=>{if(al<=.01||s<.5)return;cx.globalAlpha=al;cx.drawImage(im,x-s/2,y-s/2,s,s)};
const sm=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)};
/* nube de probabilidad: densa cerca del núcleo, rala hacia afuera */
for(let i=0;i<380;i++){const nuc=i<28,th=Math.acos(2*R()-1),ph=6.2832*R(),r=nuc?.05+R()*.09:.18+Math.pow(R(),1.7)*.95;

const E=[0,1,2].map(i=>({r:.5+i*.28,w:2.4-i*.5,a0:i*2.1,tl:.5+i*.55}));
const t0=performance.now();let PX=0,PY=0,PZ=0,PF=1;
function draw(now){if(!cv.isConnected)return;requestAnimationFrame(draw);
 const t=rm?9:Math.max(0,(now-t0)/1000),ox=W/2,oy=H*.44,an=t*.45,ca=Math.cos(an),sa=Math.sin(an),br=1+.045*Math.sin(t*2);
 cx.globalAlpha=1;cx.fillStyle="#05070d";cx.fillRect(0,0,W,H);
 const pr=(x,y,z)=>{x*=br;y*=br;z*=br;const xr=x*ca+z*sa,zr=-x*sa+z*ca,f=1/(1-zr*.3);PX=ox+xr*S*f;PY=oy+y*S*f;PZ=zr;PF=f};
 for(const p of P){if(t<p.d)continue;const u=Math.min(1,(t-p.d)/p.du);pr(p.x,p.y,p.z);const tx=PX,ty=PY,zr=PZ,f=PF,gx=ox+p.sx*W,gy=oy+p.sy*H;
  if(R()<.05)p.c[(R()*4)|0]=g();
  const fl=.75+.25*Math.sin(t*3+p.ph),rd=p.nuc?2.7*f:.5+1.1*f,fa=p.nuc?.95:Math.max(.12,Math.min(.8,(.45+.4*zr)*fl)),
   im=p.nuc?DN:DG,ds=p.nuc?rd*6.5:rd*4;
  if(u<1){/* cae como lluvia de Matrix; al acercarse los 0 y 1 se deshacen en puntitos */
   const m=sm((u-.5)/.45);
   for(let k=3;k>=0;k--){const uu=Math.max(0,u-k*.05),e=1-Math.pow(1-uu,3),x=gx+(tx-gx)*e,y=gy+(ty-gy)*e;
    if(k){if(m<1)spr(GT[p.c[k]],x,y,20,(.55-k*.12)*(1-m))}
    else{if(m<1)spr(GH[p.c[0]],x,y,20*(1-.5*m),1-m);if(m>0)spr(im,x,y,ds*(.4+.6*m),fa*m)}}}
  else spr(im,tx,ty,ds,fa)}
 if(t>2.4){/* electrones: llegan como 1 y 0 celestes y se convierten en puntos que orbitan */
  const q0=t-2.4,al=Math.min(1,q0),m=sm((q0-.2)/1.1),ap=1+(1-sm(q0/1.4))*2.2;
  E.forEach(e=>{for(let k=4;k>=0;k--){const a=e.a0+t*e.w-k*.12,x=Math.cos(a)*e.r*ap,y0=Math.sin(a)*e.r*ap;pr(x,y0*Math.cos(e.tl),y0*Math.sin(e.tl));
   const a2=al*(k?.5-k*.09:1);
   if(m<1)spr(GE[g()],PX,PY,26*PF,a2*(1-m));
   if(m>0)spr(DE,PX,PY,Math.max(.6,3.4-k*.55)*PF*6.5*m,a2*m)}})}
 cx.globalAlpha=1}
requestAnimationFrame(draw)})();
</script>

<script>

const CAPAS=(function(){
 const CATS=[["pro","Protones","#ff4d4d"],["neu","Neutrones","#9fb4c8"],["ele","Electrones","#3d9bff"],["niv","Niveles de energía","#e6ecff"],
  ["s","Subniveles s","#ff8aa0"],["p","Subniveles p","#ffd84a"],["d","Subniveles d","#4dd98a"],["f","Subniveles f","#c08cff"]],NIVS=[1,2,3,4,5,6,7];
 const est={},niv={};CATS.forEach(c=>est[c[0]]=1);NIVS.forEach(n=>niv[n]=1);let atenuar=0;const DIM=.15;
 try{const g=JSON.parse(localStorage.getItem("capas")||"null");if(g){CATS.forEach(c=>{if(g.est&&c[0] in g.est)est[c[0]]=g.est[c[0]]?1:0});
  NIVS.forEach(n=>{if(g.niv&&n in g.niv)niv[n]=g.niv[n]?1:0});atenuar=g.atenuar?1:0}}catch(e){}
 const guardar=()=>{try{localStorage.setItem("capas",JSON.stringify({est,niv,atenuar}))}catch(e){}};
 function porNombre(n){n=n||"";let m;
  if(/^proton/i.test(n))return"pro";if(/^neutron/i.test(n))return"neu";if(/^electron/i.test(n))return"ele";if(/^nivel/i.test(n))return"niv";
  if(m=/^orbital_?\d+([spdf])/i.exec(n))return m[1].toLowerCase();return null}
 /* nivel n según el nombre: Nivel_n2, Orbital_2p_0, Electron_n2_005 (sin nivel -> siempre visible) */
 function nivelNombre(n){n=n||"";let m;if(m=/^nivel_?n?(\d+)/i.exec(n))return+m[1];if(m=/^orbital_?(\d+)[spdf]/i.exec(n))return+m[1];if(m=/^electron_?n(\d+)/i.exec(n))return+m[1];return null}
 const cl=(a,b)=>Math.abs(a-b)<.06;
 function porColor(m){const c=m&&m.color;if(!c)return null;const e=m.emissive&&(m.emissive.r+m.emissive.g+m.emissive.b)>.05;
  const is=(r,g,b)=>cl(c.r,r)&&cl(c.g,g)&&cl(c.b,b);
  if(is(.1,.5,1))return"ele";if(is(.85,.12,.18))return"pro";if(is(.55,.75,.92))return"neu";if(e)return"niv";
  if(m.transparent&&m.opacity<.5){if(is(.92,.25,.25))return"s";if(is(.97,.85,.2))return"p";if(is(.25,.72,.36))return"d";if(is(.76,.42,.92))return"f"}
  return null}

 const guarda=m=>{if(!m.userData.__c)m.userData.__c={op:m.opacity,tr:m.transparent,dw:m.depthWrite};return m.userData.__c};

   El eje Y queda bloqueado a propósito: se logra girando el marcador o moviendo el celular.
   La rotación automática (botón Rotación) gira en diagonal, entre los ejes X y Z. ---------- */
(function(){

 {const cp=document.getElementById("capp");

/* ---------- Varios átomos a la vez: cada uno se ajusta a su marcador para que no se mezclen ----------
   Con 2 o más marcadores a la vista, el diámetro de cada átomo se limita a FIT × la distancia a su marcador vecino más cercano
   (queda centrado sobre su marcador y apoyado en él). Con uno solo vuelve al tamaño normal.
   ?fit=0 lo desactiva · ?fit=1.1 deja los átomos algo más grandes · el slider de tamaño solo puede achicarlos más. */
(function(){
 const FIT=Q.get("fit")===null?.92:+Q.get("fit");if(!(FIT>0))return;
 const TH=AFRAME.THREE,vs=new TH.Vector3(),MINF=.1,SUAV=.22;
 const it=[];for(const z in D){const m=document.getElementById("m"+z),w=m&&m.querySelector(":scope > a-entity");if(w)it.push({z,m,w,p:new TH.Vector3(),s:1,f:1,on:0})}
 (function tk(){requestAnimationFrame(tk);
  const v=it.filter(a=>a.m.object3D.visible);
  for(const a of v){a.m.object3D.getWorldPosition(a.p);a.m.object3D.getWorldScale(vs);a.s=vs.x>1e-6?vs.x:1}
  for(const a of it){
   const d=D[a.z],k0=+(Q.get("s")||d[3])*mult,R0=d[5]*k0;let f=1;
   if(v.length>1&&v.includes(a)){let n=1e9;for(const b of v)if(b!==a)n=Math.min(n,a.p.distanceTo(b.p)/a.s);
    f=Math.max(MINF,Math.min(1,Math.max(.3,FIT*n)/(2*R0)))}
   a.f+=(f-a.f)*SUAV;if(Math.abs(f-a.f)<.002)a.f=f;
   if(a.f<.999||a.on){a.on=a.f<.999?1:0;const g=a.on?a.f:1,k=k0*g;a.w.object3D.scale.setScalar(k);a.w.object3D.position.y=d[5]*k+.1*g}}
 })();
})();

/* ---------- Hoja: nombre flotante de la familia ----------
   Con 2 o más marcadores de una misma familia cerca, sobre el grupo flota el nombre de la familia.
   Se apaga desde el panel Capas, o con ?nombre=0. */
(function(){
 const TH=AFRAME.THREE,sc=document.querySelector("a-scene");
 const FN={alc:"Metales alcalinos",alt:"Alcalinotérreos",tr:"Metales de transición",lan:"Lantánidos",act:"Actínidos",pt:"Otros metales",mo:"Metaloides",nm:"No metales",ha:"Halógenos",gn:"Gases nobles"};
 const FC={alc:"#ff4d6a",alt:"#ff9a3d",tr:"#3da5ff",lan:"#b07dff",act:"#ff4fc3",pt:"#2dff9c",mo:"#2de8e0",nm:"#ffd84a",ha:"#b8ff3d",gn:"#7f8cff"};
 const FAM={};for(const k in G)G[k].forEach(z=>FAM[z]=k);
 const op={no:1};
 try{const g=JSON.parse(localStorage.getItem("hoja2")||"null");if(g)op.no=g.no?1:0}catch(e){}
 if(Q.get("nombre")==="0")op.no=0;
 const cp=document.getElementById("capp");
 if(cp){cp.insertAdjacentHTML("beforeend",'<div class="ch sec">Hoja de marcadores</div><button type="button" class="tgl" id="hoNo">Nombre de la familia</button>');
  const bn=cp.querySelector("#hoNo"),gu=()=>{try{localStorage.setItem("hoja2",JSON.stringify(op))}catch(e){}},
   pint=()=>{bn.classList.toggle("on",!!op.no);bn.setAttribute("aria-pressed",!!op.no)};
  bn.addEventListener("click",()=>{op.no=op.no?0:1;gu();pint()});pint()}
 const root=new TH.Group();sc.object3D.add(root);
 const lbl={};
 function label(k){if(lbl[k])return lbl[k];const c=document.createElement("canvas");c.width=640;c.height=128;const x=c.getContext("2d");
  x.font="700 62px system-ui,-apple-system,'Segoe UI',sans-serif";const w=x.measureText(FN[k]).width;
  if(w>590)x.font="700 "+Math.floor(62*590/w)+"px system-ui,-apple-system,'Segoe UI',sans-serif";
  x.textAlign="center";x.textBaseline="middle";x.shadowColor=FC[k];x.shadowBlur=22;x.fillStyle=FC[k];x.fillText(FN[k],320,66);x.fillText(FN[k],320,66);
  x.shadowBlur=5;x.fillStyle="#fff";x.globalAlpha=.9;x.fillText(FN[k],320,66);
  const s=new TH.Sprite(new TH.SpriteMaterial({map:new TH.CanvasTexture(c),transparent:true,depthTest:false,depthWrite:false}));
  s.renderOrder=20;s.scale.set(3.6,.72,1);s.visible=false;root.add(s);return lbl[k]=s}
 const ms=[...document.querySelectorAll("a-marker")].map(m=>{const z=+m.id.slice(1);return{m,w:m.querySelector(":scope > a-entity"),k:FAM[z],p:new TH.Vector3(),u:new TH.Vector3(),s:1}}).filter(a=>a.k&&a.w);
 const sv=new TH.Vector3(),MAXE=3.5;
 (function tk(){requestAnimationFrame(tk);
  const nom={};
  if(op.no){const por={};
   for(const a of ms){const o=a.m.object3D;if(!o.visible)continue;o.updateWorldMatrix(true,false);
    sv.setFromMatrixScale(o.matrixWorld);a.s=sv.x>1e-6?sv.x:1;a.p.set(0,a.w.object3D.position.y,0);o.localToWorld(a.p);a.u.set(0,1,0).transformDirection(o.matrixWorld);
    (por[a.k]=por[a.k]||[]).push(a)}
   for(const k in por){const L=por[k];if(L.length<2)continue;
    const E=[];for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const e=L[i].p.distanceTo(L[j].p)/L[i].s;if(e<=MAXE)E.push([e,i,j])}
    E.sort((a,b)=>a[0]-b[0]);const par=L.map((_,i)=>i),f=i=>{while(par[i]!==i)i=par[i]=par[par[i]];return i};
    for(const[e,i,j]of E){const a=f(i),b=f(j);if(a!==b)par[a]=b}
    const cnt={};L.forEach((_,i)=>{const r=f(i);cnt[r]=(cnt[r]||0)+1});
    let best=-1,bn=0;for(const r in cnt)if(cnt[r]>bn){bn=cnt[r];best=+r}
    if(bn>=2){const c=new TH.Vector3(),u=new TH.Vector3();let s=0,n=0;
     L.forEach((a,i)=>{if(f(i)===best){c.add(a.p);u.add(a.u);s+=a.s;n++}});c.multiplyScalar(1/n);u.normalize();s/=n;
     const sp=label(k);sp.position.copy(c).addScaledVector(u,2*s);sp.scale.set(3.6*s,.72*s,1);sp.visible=true;nom[k]=1}}}
  for(const k in lbl)if(!nom[k])lbl[k].visible=false;
 })();
})();
</script></body></html>
