<script>
(function(){const cv=document.getElementById("mx");if(!cv)return;const cx=cv.getContext("2d",{alpha:false}),rm=matchMedia("(prefers-reduced-motion:reduce)").matches,R=Math.random;

function rs(){const d=Math.min(devicePixelRatio||1,1.5);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);S=Math.min(W,H)*.34}
rs();addEventListener("resize",rs);
const g=()=>R()<.5?0:1,P=[];
/* sprites precalculados: dibujar una imagen es mucho más barato que texto con resplandor en cada cuadro */
const mk=(w,fn)=>{const c=document.createElement("canvas");c.width=c.height=w;fn(c.getContext("2d"),w);return c};
const gl=(col,glow)=>[0,1].map(d=>mk(48,(x,w)=>{x.font="bold 26px 'Courier New',monospace";x.textAlign="center";x.textBaseline="middle";x.fillStyle=col;if(glow){x.shadowColor=col;x.shadowBlur=glow}x.fillText(""+d,w/2,w/2+1)}));
const GH=gl("#e6ffee",8),GT=gl("#00ff6a",0),GE=gl("#3de6ff",9);
const rg=(w,st)=>mk(w,(x,w)=>{const q=x.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);st.forEach(s=>q.addColorStop(s[0],s[1]));x.fillStyle=q;x.fillRect(0,0,w,w)});
const DG=rg(32,[[0,"rgba(25,255,122,1)"],[.5,"rgba(25,255,122,.95)"],[1,"rgba(25,255,122,0)"]]),
 DN=rg(64,[[0,"rgba(255,255,255,1)"],[.22,"rgba(234,255,240,1)"],[.3,"rgba(120,255,170,.55)"],[1,"rgba(45,255,122,0)"]]),
 DE=rg(64,[[0,"rgba(255,255,255,1)"],[.2,"rgba(61,230,255,1)"],[.3,"rgba(61,230,255,.5)"],[1,"rgba(61,230,255,0)"]]);
const spr=(im,x,y,s,al)=>{if(al<=.01||s<.5)return;cx.globalAlpha=al;cx.drawImage(im,x-s/2,y-s/2,s,s)};
const sm=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)};
/* nube de probabilidad: densa cerca del núcleo, rala hacia afuera */
for(let i=0;i<380;i++){const nuc=i<28,th=Math.acos(2*R()-1),ph=6.2832*R(),r=nuc?.05+R()*.09:.18+Math.pow(R(),1.7)*.95;
 P.push({nuc,x:r*Math.sin(th)*Math.cos(ph),y:r*Math.cos(th),z:r*Math.sin(th)*Math.sin(ph),sx:(R()-.5)*1.1,sy:-(.55+R()*.4),d:R()*1.6,du:1.1+R(),c:[g(),g(),g(),g()],ph:6.2832*R()})}
const E=[0,1,2].map(i=>({r:.5+i*.28,w:2.4-i*.5,a0:i*2.1,tl:.5+i*.55}));
const t0=performance.now();let PX=0,PY=0,PZ=0,PF=1;
function draw(now){if(!cv.isConnected)return;requestAnimationFrame(draw);
 const t=rm?9:Math.max(0,(now-t0)/1000),ox=W/2,oy=H*.44,an=t*.45,ca=Math.cos(an),sa=Math.sin(an),br=1+.045*Math.sin(t*2);
 cx.globalAlpha=1;cx.fillStyle="#05070d";cx.fillRect(0,0,W,H);
 const pr=(x,y,z)=>{x*=br;y*=br;z*=br;const xr=x*ca+z*sa,zr=-x*sa+z*ca,f=1/(1-zr*.3);PX=ox+xr*S*f;PY=oy+y*S*f;PZ=zr;PF=f};
 for(const p of P){if(t<p.d)continue;const u=Math.min(1,(t-p.d)/p.du);pr(p.x,p.y,p.z);const tx=PX,ty=PY,zr=PZ,f=PF,gx=ox+p.sx*W,gy=oy+p.sy*H;
  if(R()<.05)p.c[(R()*4)|0]=g();
  const fl=.75+.25*Math.sin(t*3+p.ph),rd=p.nuc?2.7*f:.5+1.1*f,fa=p.nuc?.95:Math.max(.12,Math.min(.8,(.45+.4*zr)*fl)),
   im=p.nuc?DN:DG,ds=p.nuc?rd*6.5:rd*4;
  if(u<1){/* cae como lluvia de Matrix; al acercarse los 0 y 1 se deshacen en puntitos */
   const m=sm((u-.5)/.45);
   for(let k=3;k>=0;k--){const uu=Math.max(0,u-k*.05),e=1-Math.pow(1-uu,3),x=gx+(tx-gx)*e,y=gy+(ty-gy)*e;
    if(k){if(m<1)spr(GT[p.c[k]],x,y,20,(.55-k*.12)*(1-m))}
    else{if(m<1)spr(GH[p.c[0]],x,y,20*(1-.5*m),1-m);if(m>0)spr(im,x,y,ds*(.4+.6*m),fa*m)}}}
  else spr(im,tx,ty,ds,fa)}
 if(t>2.4){/* electrones: llegan como 1 y 0 celestes y se convierten en puntos que orbitan */
  const q0=t-2.4,al=Math.min(1,q0),m=sm((q0-.2)/1.1),ap=1+(1-sm(q0/1.4))*2.2;
  E.forEach(e=>{for(let k=4;k>=0;k--){const a=e.a0+t*e.w-k*.12,x=Math.cos(a)*e.r*ap,y0=Math.sin(a)*e.r*ap;pr(x,y0*Math.cos(e.tl),y0*Math.sin(e.tl));
   const a2=al*(k?.5-k*.09:1);
   if(m<1)spr(GE[g()],PX,PY,26*PF,a2*(1-m));
   if(m>0)spr(DE,PX,PY,Math.max(.6,3.4-k*.55)*PF*6.5*m,a2*m)}})}
 cx.globalAlpha=1}
requestAnimationFrame(draw)})();
</script>

<script>
/* ---------- Rendimiento: núcleo unido. Todos los protones pasan a ser UNA malla y todos los neutrones OTRA (mismo aspecto, mismas posiciones y colores):
   un átomo pesado deja de dibujar ~300 objetos sueltos del núcleo. Para comparar en el celular: ?fusnuc=0 lo apaga. ---------- */
(function(){
{const lp=new URLSearchParams(location.search).get("lob");window.__LOB=(lp===null||lp==="")?2:(+lp||0)}/* lob=2 por defecto: burbuja con matemática más barata + luz simple en los lóbulos. ?lob=1 solo la matemática; ?lob=0 aspecto original */
const TH=window.AFRAME&&AFRAME.THREE;if(!TH)return;
const N=window.__NUC={n:0,ahorro:0,on:new URLSearchParams(location.search).get("fusnuc")!=="0"};
/* Medición para el panel ?d=1. dibujo = ms de CPU que tarda three.js en enviar los dibujos (solo la función render original, sin el trabajo de los módulos).
   Si el renderer ya existe se envuelve directamente; si no, se intercepta la asignación this.render=... del constructor (en three r137 render es propiedad de instancia, no del prototipo).
   Con ?sync=1 además se mide la espera de la GPU (lee 1 píxel tras dibujar; solo para diagnóstico). */
try{const SY=new URLSearchParams(location.search).get("sync")==="1",PX=new Uint8Array(4);
 const env=(me,fn)=>function(a,b){const R=me||this,t=performance.now();let x;try{x=fn.call(R,a,b)}finally{const t1=performance.now();window.__RT=(window.__RT||0)*.9+(t1-t)*.1;
  if(SY){try{const gl=R.getContext();gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,PX);window.__GW=(window.__GW||0)*.9+(performance.now()-t1)*.1}catch(e){}}}return x};
 const s0=document.querySelector("a-scene"),r0=s0&&s0.renderer,P=TH.WebGLRenderer.prototype;
 if(r0&&typeof r0.render==="function")r0.render=env(r0,r0.render);
 else if(!Object.getOwnPropertyDescriptor(P,"render"))Object.defineProperty(P,"render",{configurable:true,get(){return undefined},set(fn){Object.defineProperty(this,"render",{value:env(null,fn),writable:true,configurable:true,enumerable:true})}})}catch(e){window.__err="medición "+e.message}
/* Une todos los protones en UNA malla y todos los neutrones en OTRA (misma forma, mismo material, mismas posiciones).
   Se ve idéntico, pero el átomo pasa de ~300 dibujos de núcleo a 2. Devuelve cuántos objetos se ahorraron. */
function fusionarNucleos(root,TH){
 if(!root||root.userData.__nuc!==undefined)return 0;root.userData.__nuc=0;
 const grupos={pro:[],neu:[]};
 root.traverse(o=>{if(!o.isMesh||!o.geometry||Array.isArray(o.material)||o.isSkinnedMesh||o.isInstancedMesh)return;
  const n=o.name||"";if(/^proton/i.test(n))grupos.pro.push(o);else if(/^neutron/i.test(n))grupos.neu.push(o)});
 let ahorro=0;
 for(const k of["pro","neu"]){
  const L=grupos[k];if(L.length<2)continue;
  const par=L[0].parent,mat=L[0].material;if(!par)continue;
  /* solo si es seguro: mismo padre, mismo material, solo posición+normal en float y todo con índices */
  const okAttr=g=>{const a=Object.keys(g.attributes);return a.length===2&&g.attributes.position&&g.attributes.normal&&g.index&&
   g.attributes.position.array instanceof Float32Array&&g.attributes.normal.array instanceof Float32Array&&!g.attributes.position.isInterleavedBufferAttribute&&!g.attributes.normal.isInterleavedBufferAttribute&&!(g.morphAttributes&&Object.keys(g.morphAttributes).length)};
  if(!L.every(o=>o.parent===par&&o.material===mat&&okAttr(o.geometry)))continue;
  let nv=0,ni=0;for(const o of L){nv+=o.geometry.attributes.position.count;ni+=o.geometry.index.count}
  const P=new Float32Array(nv*3),N=new Float32Array(nv*3),I=nv>65535?new Uint32Array(ni):new Uint16Array(ni);
  const v=new TH.Vector3(),nm=new TH.Matrix3();let vo=0,io=0;
  for(const o of L){
   const g=o.geometry,pa=g.attributes.position,na=g.attributes.normal,ix=g.index;
   o.updateMatrix();nm.getNormalMatrix(o.matrix);/* la posición/escala propia de cada nucleón se "hornea" en los vértices */
   for(let i=0;i<pa.count;i++){
    v.set(pa.getX(i),pa.getY(i),pa.getZ(i)).applyMatrix4(o.matrix);const j=(vo+i)*3;P[j]=v.x;P[j+1]=v.y;P[j+2]=v.z;
    v.set(na.getX(i),na.getY(i),na.getZ(i)).applyMatrix3(nm).normalize();N[j]=v.x;N[j+1]=v.y;N[j+2]=v.z}
   for(let i=0;i<ix.count;i++)I[io+i]=ix.getX(i)+vo;
   vo+=pa.count;io+=ix.count}
  const G=new TH.BufferGeometry();G.setAttribute("position",new TH.BufferAttribute(P,3));G.setAttribute("normal",new TH.BufferAttribute(N,3));G.setIndex(new TH.BufferAttribute(I,1));
  G.computeBoundingBox();G.computeBoundingSphere();
  const M=new TH.Mesh(G,mat);M.name=k==="pro"?"Proton_unido":"Neutron_unido";/* el prefijo "Proton"/"Neutron" mantiene el botón de Capas funcionando */
  M.userData.nucleones=L.length;
  L.forEach(o=>par.remove(o));par.add(M);
  ahorro+=L.length-1}
 root.userData.__nuc=ahorro;return ahorro}
/* lob>=2: los lóbulos translúcidos (los que más píxeles pintan) pasan de PBR completo a luz simple (Lambert). Mantiene color, opacidad, caras y mezcla. */
function lobulosBaratos(root){
 if(!root||root.userData.__lob)return;root.userData.__lob=1;const mp=new Map();
 root.traverse(o=>{if(!o.isMesh||Array.isArray(o.material)||!/^orbital_?\d+[spdf]/i.test(o.name||""))return;
  const m=o.material;if(!m||!m.isMeshStandardMaterial||!m.transparent||m.flatShading)return;
  let n=mp.get(m);if(!n){n=new TH.MeshLambertMaterial({color:m.color.clone(),transparent:true,opacity:m.opacity,side:m.side,depthWrite:m.depthWrite,depthTest:m.depthTest,blending:m.blending,vertexColors:m.vertexColors});n.name=m.name;n.userData=Object.assign({},m.userData);mp.set(m,n)}
  o.material=n})}
const hacer=root=>{try{if(N.on){const a=fusionarNucleos(root,TH);if(a>0){N.n++;N.ahorro+=a}}if(window.__LOB>=2)lobulosBaratos(root)}catch(e){window.__err="rendimiento "+e.message}};
window.__OPT=hacer;
/* captura: corre ANTES que Capas, la medición de tamaño y los demás módulos, así ninguno llega a ver los nucleones sueltos */

     iónica    → el/los electrones de la última capa del metal viajan de verdad hasta el no metal (se apagan en uno y aparecen en el otro), SIEMPRE en un solo sentido:
                 del átomo que lo cede al que lo recibe. El metal queda con carga + y el no metal con carga − (Na⁺ · Cl⁻). Si faltan o sobran electrones (Na + O, Mg + Cl) se ve que viene/va otro átomo.
                 Al cerrar el ciclo el electrón recibido se deshace en el no metal y el original reaparece en el metal (sin viaje de vuelta), y el salto empieza de nuevo, en bucle.
                 El electrón se carga y vuela celeste; al impactar y quedarse en el otro átomo se pone dorado/amarillo y titila (hasta que se deshace), para que se vea bien cuál es.
     covalente → un electrón de cada átomo se comparten: giran en ocho alrededor de los dos núcleos y entre ellos brilla la nube de la unión (simple, doble o triple).
