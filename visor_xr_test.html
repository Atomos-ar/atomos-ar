<title>Átomos en realidad aumentada</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#05070d;--fg:#e9f3ff;--mut:#9fb0d0;--ac:#3de6ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font-family:inherit;touch-action:manipulation}
#ov{position:fixed;inset:0;z-index:5}
body.ar #ov{background:none}
/* ---- pantalla de inicio ---- */
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
body.ar #start{display:none}
#start h1{margin:0;font-size:clamp(24px,7vw,34px);font-weight:300;letter-spacing:.6px;color:#f2f9ff;text-shadow:0 0 6px rgba(61,230,255,.75),0 0 22px rgba(61,230,255,.35)}
#start p{margin:0;max-width:420px;color:var(--mut);line-height:1.5;font-size:15px}
#go{padding:13px 30px;border-radius:999px;background:transparent;border:1.5px solid var(--ac);color:var(--ac);font-weight:600;font-size:17px;letter-spacing:.5px;text-shadow:0 0 8px rgba(61,230,255,.7);box-shadow:0 0 12px rgba(61,230,255,.35),inset 0 0 10px rgba(61,230,255,.12)}
#start a{color:var(--mut);font-size:14px}
#err{max-width:420px;color:#ffb3b3;font-size:14px;line-height:1.45}
#err[hidden]{display:none}
/* ---- interfaz dentro de la AR ---- */
#catch{position:absolute;inset:0;z-index:1;touch-action:none}
#hud{position:absolute;inset:0;z-index:2;pointer-events:none}
body:not(.ar) #catch,body:not(.ar) #hud{display:none}
#hud>*{pointer-events:auto}
.tb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));z-index:15;padding:8px 14px;border-radius:20px;border:0;background:rgba(5,7,13,.7);color:#fff;font-size:15px}
.tb.on{background:rgba(61,230,255,.28)}
#exit{left:8px}#quizb{left:50%;transform:translateX(-50%)}
#card{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:14;width:min(88vw,360px);padding:10px 14px;border-radius:16px;background:rgba(8,12,24,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-align:center;font-size:14px;line-height:1.4}
#card[hidden]{display:none}
#card b{font-size:18px;display:block;margin-bottom:2px}
#card .cfg{margin-top:4px;color:var(--mut);font-size:12.5px;word-break:break-word}
#card button{margin-top:8px;padding:7px 14px;border-radius:12px;border:0;background:rgba(61,230,255,.22);color:#fff;font-size:14px}
#bot{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#bot>*{pointer-events:auto}
#hint{max-width:92vw;padding:7px 14px;border-radius:14px;background:rgba(8,12,24,.85);font-size:13px;text-align:center;pointer-events:none!important}
#air{padding:9px 16px;border-radius:999px;border:1.5px solid var(--ac);background:rgba(5,7,13,.7);color:var(--ac);font-size:14px}
#air[hidden],#sel[hidden]{display:none}
#sel{width:min(96vw,420px);padding:10px;border-radius:16px;background:rgba(8,12,24,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#sel .rw{display:flex;gap:6px;margin-bottom:8px}
#sel .rw button{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:#fff;font-size:13px}
#sel .rw button.on{border-color:var(--ac);background:rgba(61,230,255,.16)}
#sel label{display:flex;align-items:center;gap:10px;font-size:13px;color:#cfd8ee;margin-top:4px}
#sel label span{width:52px;flex:none}
#sel input{flex:1;min-width:0;height:22px;margin:0}
#chips{display:flex;gap:6px;overflow-x:auto;width:100%;max-width:100vw;padding:2px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips .el{flex:none;min-width:48px;padding:6px 8px;border-radius:12px;border:1.5px solid var(--c);background:rgba(5,7,13,.72);color:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;opacity:.75}
#chips .el b{font-size:16px;line-height:1.1}#chips .el small{font-size:10.5px;color:var(--mut)}
#chips .el.on{opacity:1;background:rgba(255,255,255,.18);box-shadow:0 0 10px var(--c)}
#capb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:15;padding:8px 14px;border-radius:20px;border:0;background:rgba(5,7,13,.7);color:#fff;font:15px system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#capb.on{background:rgba(61,230,255,.28)}
#capp{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));right:8px;z-index:16;width:min(270px,86vw);padding:10px 10px 12px;border-radius:16px;background:rgba(8,12,24,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font:14px system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#capp[hidden]{display:none}
#capp .ch{font-size:12px;letter-spacing:.5px;color:#9fb0d0;margin:0 2px 8px}
#capp .cg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#capp .chip{display:flex;align-items:center;gap:7px;padding:9px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:#cfd8ee;font:13px system-ui,sans-serif;text-align:left;touch-action:manipulation;opacity:.5}
#capp .chip i{flex:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--c);background:transparent}
#capp .chip.on{opacity:1;border-color:var(--c);color:#fff;background:rgba(255,255,255,.07)}
#capp .chip.on i{background:var(--c);box-shadow:0 0 8px var(--c)}
#capp .cf{display:flex;gap:6px;margin-top:8px}
#capp .cf button{flex:1;padding:8px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font:13px system-ui,sans-serif;touch-action:manipulation}
#capp .ca{display:flex;align-items:center;gap:8px;margin:10px 2px 0;font-size:13px;color:#cfd8ee}

#capp{max-height:calc(100vh - 70px - env(safe-area-inset-top,0px));overflow-y:auto}
#capp .cn{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
#capp .cn button{padding:9px 0;border-radius:10px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:#cfd8ee;font:600 13px system-ui,sans-serif;opacity:.5;touch-action:manipulation}
#capp .cn button.on{opacity:1;border-color:#3de6ff;background:rgba(61,230,255,.16);color:#fff;box-shadow:0 0 8px rgba(61,230,255,.35)}
#capp .sec{margin-top:12px}
</style></head><body>
<div id="ov">
 <div id="start">
  <h1>Átomos en realidad aumentada</h1>
  <p>Elige un elemento, apunta a una superficie y toca la pantalla para colocar el átomo. Podrás caminar a su alrededor, agacharte y verlo desde cualquier ángulo.</p>
  <button id="go" type="button">Iniciar AR</button>
  <div id="err" hidden><span id="et">No se pudo iniciar la realidad aumentada en este dispositivo.</span> <a id="fb" href="visor_test.html">Usar la versión estándar</a></div>
  <a id="gr" href="lector_test.html">‹ Grupos</a>
 </div>
 <div id="catch"></div>
 <div id="hud">
  <button class="tb" id="exit" type="button">‹ Salir</button>
  <button class="tb" id="quizb" type="button">Quiz</button>
  <div id="card" hidden></div>
  <div id="bot">
   <div id="hint"></div>
   <button id="air" type="button" hidden>En el aire, frente a mí</button>
   <div id="sel" hidden>
    <div class="rw"><button id="bauto" type="button">Girar solo</button><button id="bmov" type="button">Mover</button><button id="bdel" type="button">Eliminar</button><button id="bok" type="button">Listo</button></div>
    <label><span>Tamaño</span><input id="stam" type="range" min="-100" max="100" step="1" value="0" aria-label="Tamaño"></label>
    <label><span>Altura</span><input id="salt" type="range" min="0" max="100" step="1" value="29" aria-label="Altura"></label>
   </div>
   <div id="chips"></div>
  </div>
 </div>
</div>

const loader=new GLTFLoader(),cache={};
function cargar(z){return cache[z]||(cache[z]=new Promise((ok,ko)=>loader.load("glb/"+z+".glb",g=>{
 const sc=g.scene;sc.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(sc),sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(sz.x,sz.y,sz.z);
 ok({sc,s0:m>0&&isFinite(m)?TARGET/m:1,c})},undefined,ko)))}
function escala(a){a.S.scale.setScalar((a.s0||1)*a.mult);a.ring.scale.setScalar(TARGET*a.mult*.55)}
function nuevo(z){const A=new THREE.Group(),S=new THREE.Group(),
 ring=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),new THREE.MeshBasicMaterial({color:0x3de6ff,transparent:true,opacity:.1,depthWrite:false}));
 ring.visible=false;A.add(S,ring);scene.add(A);
 const a={z,A,S,ring,model:null,base:new THREE.Vector3(),lift:.35,mult:1,anchor:null,auto:false,s0:0};atoms.push(a);escala(a);
 cargar(z).then(t=>{if(!atoms.includes(a))return;const m=t.sc.clone(true);
  m.traverse(o=>{if(o.isMesh)o.material=Array.isArray(o.material)?o.material.map(x=>x.clone()):o.material.clone()});
  m.position.copy(t.c).multiplyScalar(-1);S.add(m);a.model=m;a.s0=t.s0;escala(a);CAPAS.aplicarModelo(m)})
  .catch(()=>{msg("No se pudo cargar glb/"+z+".glb");quitar(a)});
 return a}
function quitar(a){const i=atoms.indexOf(a);if(i<0)return;atoms.splice(i,1);scene.remove(a.A);
 if(a.anchor){try{a.anchor.delete()}catch(e){}}
 a.A.traverse(o=>{if(o.isMesh)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m&&m.dispose&&m.dispose())});
 if(sel===a)sel=null;ui()}

/* ---------- Interfaz ---------- */
let mt;const hintEl=$("hint");let hintTxt="";
function msg(t){hintEl.textContent=t;hintTxt="";clearTimeout(mt);mt=setTimeout(()=>{hintTxt=""},3000);hintLock=performance.now()+3000}
let hintLock=0;
function pista(){if(performance.now()<hintLock)return;let t;
 if(moving||curZ!==null){t=!lastHit?"Mueve el teléfono despacio para detectar una superficie, o usa «En el aire»":(moving?"Toca la pantalla para mover aquí el átomo":"Toca la pantalla para colocar "+(E[curZ]?E[curZ][0]:curZ))}
 else if(sel)t="Arrastra para girar · pellizca para el tamaño";
 else t=atoms.length?"Toca un átomo para ver su ficha":"Elige un elemento abajo para colocarlo";
 if(t!==hintTxt){hintTxt=t;hintEl.textContent=t}}
const chips={};
ZS.forEach(z=>{const b=document.createElement("button");b.type="button";b.className="el";b.style.setProperty("--c",col[z]);
 b.innerHTML="<b>"+(E[z]?E[z][1]:z)+"</b><small>"+z+"</small>";b.setAttribute("aria-label",E[z]?E[z][0]:""+z);
 b.addEventListener("click",()=>{curZ=curZ===z?null:z;moving=false;ui()});$("chips").appendChild(b);chips[z]=b});
function card(){const c=$("card");if(!sel){c.hidden=true;return}const d=E[sel.z]||["Elemento "+sel.z,"",""];c.hidden=false;
 if(quiz&&!revealed){c.innerHTML="<b>¿Qué elemento es?</b><div>¿Cuántos protones y electrones tiene?</div><button type=\"button\" id=\"rev\">Ver respuesta</button>";$("rev").onclick=()=>{revealed=true;card()}}
 else c.innerHTML="<b>"+d[0]+" ("+d[1]+")</b><div>Número atómico "+sel.z+" · "+sel.z+" protones · "+sel.z+" electrones</div><div class=\"cfg\">"+d[2]+"</div>"}
function ui(){for(const z in chips)chips[z].classList.toggle("on",curZ===+z);
 atoms.forEach(a=>a.ring.visible=a===sel);
 $("sel").hidden=!sel;$("air").hidden=!(curZ!==null||moving);
 if(sel){$("bauto").classList.toggle("on",sel.auto);$("bmov").classList.toggle("on",moving);
  $("stam").value=Math.round(Math.log2(sel.mult)*50);$("salt").value=Math.round(sel.lift/1.2*100)}
 card()}
function seleccionar(a){sel=a;revealed=false;moving=false;ui()}
$("bauto").onclick=()=>{if(sel){sel.auto=!sel.auto;ui()}};
$("bmov").onclick=()=>{if(sel){moving=!moving;curZ=null;ui()}};
$("bdel").onclick=()=>{if(sel)quitar(sel)};
$("bok").onclick=()=>{curZ=null;moving=false;seleccionar(null)};
$("stam").addEventListener("input",e=>{if(sel)ajustar(sel,Math.pow(2,e.target.value/50))});
$("salt").addEventListener("input",e=>{if(sel)sel.lift=e.target.value/100*1.2});
$("air").onclick=()=>{if(moving&&sel)want={move:true,air:true};else if(curZ!==null)want={z:curZ,air:true}};
$("quizb").onclick=()=>{quiz=!quiz;revealed=false;$("quizb").classList.toggle("on",quiz);card()};
$("exit").onclick=()=>{if(session)session.end()};
function ajustar(a,m){a.mult=Math.min(4,Math.max(.25,m));escala(a);if(a===sel)$("stam").value=Math.round(Math.log2(a.mult)*50)}

/* ---------- Capas: mismos botones que el visor con marcadores ---------- */
(function(){
 const todo=()=>atoms.forEach(a=>a.model&&CAPAS.aplicarModelo(a.model));
 const b=document.createElement("button");b.id="capb";b.type="button";b.textContent="Capas";b.setAttribute("aria-expanded","false");
 const p=document.createElement("div");p.id="capp";p.hidden=true;
 p.innerHTML='<div class="ch">Capas del átomo</div><div class="cg"></div><div class="cf"><button type="button" data-a="todo">Todo</button><button type="button" data-a="nada">Nada</button></div>'
  +'<div class="ch sec">Niveles de energía (n)</div><div class="cn"></div><div class="cf cv"><button type="button" data-v="todo">Todos</button><button type="button" data-v="nada">Ninguno</button></div>'
  +'<label class="ca"><input type="checkbox" id="capt"> Atenuar en vez de ocultar</label>';
 $("hud").append(b,p);
 const g=p.querySelector(".cg"),gn=p.querySelector(".cn"),ch={},cn={};
 CAPAS.CATS.forEach(([k,n,c])=>{const x=document.createElement("button");x.type="button";x.className="chip";x.dataset.k=k;x.style.setProperty("--c",c);x.innerHTML="<i></i>"+n;g.appendChild(x);ch[k]=x;
  x.addEventListener("click",()=>{CAPAS.est[k]=CAPAS.est[k]?0:1;sync();todo()})});
 CAPAS.NIVS.forEach(n=>{const x=document.createElement("button");x.type="button";x.textContent=n;x.setAttribute("aria-label","Nivel "+n);gn.appendChild(x);cn[n]=x;
  x.addEventListener("click",()=>{CAPAS.niv[n]=CAPAS.niv[n]?0:1;sync();todo()})});
 const t=p.querySelector("#capt");
 function sync(){for(const k in ch){const on=!!CAPAS.est[k];ch[k].classList.toggle("on",on);ch[k].setAttribute("aria-pressed",on)}
  for(const n in cn){const on=!!CAPAS.niv[n];cn[n].classList.toggle("on",on);cn[n].setAttribute("aria-pressed",on)}
  t.checked=!!CAPAS.atenuar;CAPAS.guardar()}
 p.querySelectorAll(".cf:not(.cv) button").forEach(x=>x.addEventListener("click",()=>{const v=x.dataset.a=="todo"?1:0;for(const k in CAPAS.est)CAPAS.est[k]=v;sync();todo()}));
 p.querySelectorAll(".cv button").forEach(x=>x.addEventListener("click",()=>{const v=x.dataset.v=="todo"?1:0;for(const n in CAPAS.niv)CAPAS.niv[n]=v;sync();todo()}));
 t.addEventListener("change",()=>{CAPAS.atenuar=t.checked;sync();todo()});
 b.addEventListener("click",()=>{p.hidden=!p.hidden;b.setAttribute("aria-expanded",!p.hidden);b.classList.toggle("on",!p.hidden)});
 sync()})();

/* ---------- Gestos: tocar = elegir o colocar · arrastrar = girar · pellizcar = tamaño ---------- */
const ov=$("ov"),cat=$("catch"),P=new Map();let pd=0,multi=false;
ov.addEventListener("beforexrselect",e=>e.preventDefault());
const dist=()=>{const a=[...P.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
const ray=new THREE.Raycaster(),sp=new THREE.Sphere(),tmp=new THREE.Vector3();
function elegir(x,y){const cam=renderer.xr.getCamera();ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam);
 let best=null,bd=1e9;for(const a of atoms){sp.center.copy(a.A.position);sp.radius=TARGET*a.mult*.55;const p=ray.ray.intersectSphere(sp,tmp);
  if(p){const d=p.distanceTo(ray.ray.origin);if(d<bd){bd=d;best=a}}}return best}
const cq=new THREE.Quaternion(),qa=new THREE.Quaternion(),vu=new THREE.Vector3(),vr=new THREE.Vector3(),vy=new THREE.Vector3(0,1,0);
function girar(a,dx,dy){renderer.xr.getCamera().getWorldQuaternion(cq);vu.set(0,1,0).applyQuaternion(cq);vr.set(1,0,0).applyQuaternion(cq);
 a.S.quaternion.premultiply(qa.setFromAxisAngle(vu,dx*.01));a.S.quaternion.premultiply(qa.setFromAxisAngle(vr,dy*.01))}
function toque(x,y){const a=elegir(x,y);
 if(moving){want={move:true};return}
 if(a){curZ=null;seleccionar(a);return}
 if(curZ!==null){want={z:curZ};return}
 if(sel)seleccionar(null)}
cat.addEventListener("pointerdown",e=>{if(!renderer.xr.isPresenting)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()});
 if(P.size>=2){multi=true;pd=dist()}});
cat.addEventListener("pointermove",e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(!sel)return;
 if(P.size==1)girar(sel,dx,dy);else if(P.size==2){const d=dist();if(pd>0&&d>0)ajustar(sel,sel.mult*d/pd);pd=d}});
const fin=e=>{const p=P.get(e.pointerId);if(!p)return;P.delete(e.pointerId);pd=P.size==2?dist():0;
 if(P.size==0){const tap=!multi&&e.type=="pointerup"&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<10&&performance.now()-p.t<500;multi=false;if(tap)toque(e.clientX,e.clientY)}};
cat.addEventListener("pointerup",fin);cat.addEventListener("pointercancel",fin);

/* ---------- Colocar y mantener anclado: se hace dentro del cuadro XR para poder crear anclas ---------- */
function colocar(frame,rs){const w=want;want=null;if(!w)return;
 if(!w.move&&atoms.length>=MAXA){msg("Máximo "+MAXA+" átomos a la vez: elimina alguno");return}
 if(w.move&&!sel)return;
 const pos=new THREE.Vector3();
 if(w.air){const c=renderer.xr.getCamera(),d=new THREE.Vector3();c.getWorldDirection(d);pos.setFromMatrixPosition(c.matrixWorld).addScaledVector(d,.8)}
 else if(lastHit)pos.setFromMatrixPosition(reticle.matrix);
 else{msg("Aún no se detecta una superficie");return}
 let a;if(w.move){a=sel;if(a.anchor){try{a.anchor.delete()}catch(e){}a.anchor=null}}else a=nuevo(w.z);
 a.base.copy(pos);a.lift=w.air?0:.35;a.A.position.set(pos.x,pos.y+a.lift,pos.z);
 try{const pr=(!w.air&&lastHit&&lastHit.createAnchor)?lastHit.createAnchor():(frame.createAnchor?frame.createAnchor(new XRRigidTransform({x:pos.x,y:pos.y,z:pos.z}),rs):null);
  if(pr)pr.then(an=>{if(atoms.includes(a))a.anchor=an;else{try{an.delete()}catch(e){}}}).catch(()=>{})}catch(e){}
 curZ=null;seleccionar(a)}
let last=performance.now();
renderer.setAnimationLoop((t,frame)=>{const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 if(frame){const rs=renderer.xr.getReferenceSpace();lastHit=null;
  if(hitSrc&&rs){const r=frame.getHitTestResults(hitSrc);if(r.length){const pose=r[0].getPose(rs);if(pose){reticle.matrix.fromArray(pose.transform.matrix);lastHit=r[0]}}}
  reticle.visible=!!lastHit&&(curZ!==null||moving);
  colocar(frame,rs);
  for(const a of atoms){if(a.anchor){const p=frame.getPose(a.anchor.anchorSpace,rs);if(p){const q=p.transform.position;a.base.set(q.x,q.y,q.z)}}
   a.A.position.set(a.base.x,a.base.y+a.lift,a.base.z)}}
 for(const a of atoms)if(a.auto)a.S.quaternion.premultiply(qa.setFromAxisAngle(vy,dt*.7));
 pista();renderer.render(scene,camera)});

/* ---------- Sesión AR ---------- */
function terminar(){session=null;hitSrc=null;lastHit=null;document.body.classList.remove("ar");
 [...atoms].forEach(quitar);curZ=null;moving=false;want=null;P.clear();ui()}
$("go").addEventListener("click",async()=>{$("err").hidden=true;
 try{session=await navigator.xr.requestSession("immersive-ar",{requiredFeatures:["hit-test","dom-overlay"],optionalFeatures:["anchors"],domOverlay:{root:ov}});
  session.addEventListener("end",terminar);
  renderer.xr.setReferenceSpaceType("local");await renderer.xr.setSession(session);
  const vs=await session.requestReferenceSpace("viewer");hitSrc=await session.requestHitTestSource({space:vs});
  document.body.classList.add("ar");ui()}
 catch(e){if(session){try{session.end()}catch(_){}}session=null;$("err").hidden=false}});
addEventListener("resize",()=>{if(!renderer.xr.isPresenting)renderer.setSize(innerWidth,innerHeight)});
ui();
</script></body></html>
